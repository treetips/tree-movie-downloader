name: Label PR

# PRタイトルのConventional Commits接頭辞からラベルを自動付与する。
# GitHubのリリースノートは.github/release.ymlのラベル基準でカテゴリ分類
# されるため、ラベル付与が漏れると全PRが「その他」に分類されてしまう。
on:
  pull_request:
    branches:
      - main
    types: [opened, edited, reopened]

permissions:
  # 不足しているリリース分類用ラベルを作成するために必要。
  issues: write
  pull-requests: write

jobs:
  label:
    name: ラベル自動付与
    runs-on: ubuntu-latest
    steps:
      - name: 接頭辞の判定とラベル付与
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # タイトルの先頭から最初の「:」までを接頭辞部として扱う。
          prefix_raw="${PR_TITLE%%:*}"
          # typeのみを抽出する。scopeがある場合は別途分離する。
          # 例: "feat(scope): 題名" → prefix_raw="feat(scope)", type="feat", scope="scope"
          type="${prefix_raw%%(*}"
          type="$(printf '%s' "$type" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          scope=""
          if [[ "$prefix_raw" == *'('* ]]; then
            scope="$(printf '%s' "$prefix_raw" | sed -E 's/^[^(]*\(([^)]+)\).*/\1/' | tr '[:upper:]' '[:lower:]')"
          fi

          # 接頭辞と.github/release.yml側ラベルの対応。
          # 対応がなければ空のままにし、「その他」カテゴリに分類させる。
          label=""
          case "$type" in
            feat)     label="feature" ;;
            fix)      label="fix" ;;
            perf)     label="performance" ;;
            refactor) label="improvement" ;;
            docs)     label="documentation" ;;
            build|chore|ci)
              # scopeがdeps/dependenciesのときのみ依存更新として分類する。
              if [[ "$scope" == "deps" || "$scope" == "dependencies" ]]; then
                label="dependencies"
              fi
              ;;
            *)
              # Dependabotのような「Bump ...」形式のタイトルを依存更新として扱う。
              if [[ "$PR_TITLE" == "Bump "* ]]; then
                label="dependencies"
              fi
              ;;
          esac

          # 必要なラベルが削除・未作成の環境でも再現できるように自動作成する。
          if [[ -n "$label" ]]; then
            existing_labels="$(gh label list --repo "$REPO" --limit 1000 --json name --jq '.[].name')"
            if ! grep -Fxq "$label" <<< "$existing_labels"; then
              case "$label" in
                feature)       label_description="新機能"; label_color="1d76db" ;;
                fix)           label_description="バグ修正"; label_color="d73a4a" ;;
                performance)   label_description="パフォーマンス改善"; label_color="fbca04" ;;
                improvement)   label_description="改善"; label_color="a2eeef" ;;
                documentation) label_description="ドキュメント"; label_color="0075ca" ;;
                dependencies)  label_description="依存パッケージ更新"; label_color="0366d6" ;;
              esac
              gh label create "$label" --repo "$REPO" \
                --description "$label_description" --color "$label_color"
            fi
          fi

          # タイトル変更時の再分類に備え、PRに付いている自動ラベルを外して付け直す。
          auto_labels=(feature fix performance improvement documentation dependencies)
          pr_labels="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.[].name')"
          for l in "${auto_labels[@]}"; do
            if grep -Fxq "$l" <<< "$pr_labels"; then
              gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$l"
            fi
          done

          if [[ -n "$label" ]]; then
            echo "Adding label: $label"
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$label"
          else
            echo "No matching label (will appear in 'Other Changes' category)"
          fi
