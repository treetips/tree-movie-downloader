name: Release Tools

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '配布先のリリースタグ（アプリ本体とは独立）'
        required: true
        default: 'tools-latest'
      yt_dlp_version:
        description: 'yt-dlp のバージョン（空なら最新）'
        required: false
        default: ''
      ffmpeg_static_tag:
        description: 'eugeneware/ffmpeg-static のタグ（空なら最新）'
        required: false
        default: ''
      deno_version:
        description: 'Deno のバージョン（空なら最新）'
        required: false
        default: ''
      force:
        description: '上流の更新がなくても配布物を再作成する'
        required: false
        type: boolean
        default: false

concurrency:
  group: tools-release-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish Tools
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for upstream updates
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          YT_DLP_VERSION: ${{ inputs.yt_dlp_version }}
          FFMPEG_STATIC_TAG: ${{ inputs.ffmpeg_static_tag }}
          DENO_VERSION: ${{ inputs.deno_version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          chmod +x tools/preflight-tools-release.sh
          tools/preflight-tools-release.sh

      - name: Build tool assets
        if: steps.preflight.outputs.changed == 'true'
        env:
          TAG: ${{ inputs.tag }}
          REPO_URL: https://github.com/${{ github.repository }}
          YT_DLP_VERSION: ${{ steps.preflight.outputs.yt_dlp_version }}
          FFMPEG_STATIC_TAG: ${{ steps.preflight.outputs.ffmpeg_static_tag }}
          DENO_VERSION: ${{ steps.preflight.outputs.deno_version }}
        run: |
          set -euo pipefail
          : "${YT_DLP_VERSION:?preflight の yt-dlp バージョンが空です}"
          : "${FFMPEG_STATIC_TAG:?preflight の ffmpeg-static タグが空です}"
          : "${DENO_VERSION:?preflight の Deno バージョンが空です}"
          chmod +x tools/build-release-assets.sh
          tools/build-release-assets.sh dist-tools "$YT_DLP_VERSION" "$FFMPEG_STATIC_TAG" "$DENO_VERSION"

      - name: Publish GitHub Release
        if: steps.preflight.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          chmod +x tools/publish-tools-release.sh
          tools/publish-tools-release.sh dist-tools
