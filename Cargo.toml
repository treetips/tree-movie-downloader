[package]
name = "tree-movie-downloader"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "yt-dlp を GUI で扱うためのデスクトップアプリ"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
smol = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
image = { version = "0.25", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# ビルド時間とバイナリサイズのバランスを取る。
lto = "thin"
codegen-units = 16
strip = "symbols"
